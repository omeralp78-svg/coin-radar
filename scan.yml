name: Coin Radar - Otomatik Tarama

on:
  schedule:
    # Her 15 dakikada bir calisir (GitHub'in gecikme yapabilecegi zamanlar haric)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # Bu sayede GitHub sayfasindan "Run workflow" ile elle de tetikleyebilirsin

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari yukle
        run: npm install
        working-directory: scripts

      - name: Taramayi calistir
        run: node scan.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
